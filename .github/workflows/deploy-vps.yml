name: Deploy Hredoy Deploy OS to VPS

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "README*"
      - "scripts/qa-*.ts"
  workflow_dispatch:
    inputs:
      full_deploy:
        description: "Run dependency install, full validation, build, and PM2 recreation"
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-techteam-deploy-os-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy on VPS self-hosted runner
    runs-on: [self-hosted, vps, deploy-os]
    timeout-minutes: 45

    steps:
      - name: Run fast incremental deploy on VPS
        env:
          FORCE_FULL_DEPLOY: ${{ github.event_name == 'workflow_dispatch' && inputs.full_deploy || false }}
        run: |
          cd /var/www/techteam-deploy-os
          chmod +x scripts/deploy-vps.sh
          bash scripts/deploy-vps.sh
