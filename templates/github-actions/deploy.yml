name: Deploy with Hredoy Deploy OS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hredoy-deploy-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Hredoy Deploy OS
        env:
          DEPLOY_API_URL: ${{ secrets.DEPLOY_API_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors \
            -X POST "$DEPLOY_API_URL/api/deployments/trigger" \
            -H "Authorization: Bearer $DEPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "projectSlug": "replace-with-project-slug",
              "repository": "${{ github.repository }}",
              "branch": "${{ github.ref_name }}",
              "commit": "${{ github.sha }}",
              "runId": "${{ github.run_id }}",
              "runAttempt": "${{ github.run_attempt }}"
            }'
