services:
  postgres:
    image: postgres:16
    container_name: deploy-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: deploy_os
      POSTGRES_PASSWORD: deploy_os_password
      POSTGRES_DB: deploy_os
    ports:
      - "127.0.0.1:15434:5432"
    volumes:
      - deploy_os_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deploy_os -d deploy_os"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - default
      - deploy_runtime

  redis:
    image: redis:7-alpine
    container_name: deploy-os-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - default
      - deploy_runtime

  caddy:
    image: caddy:2-alpine
    container_name: deploy-os-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  deploy_os_postgres:
  caddy_data:
  caddy_config:

networks:
  deploy_runtime:
    name: techteam-deploy-network
